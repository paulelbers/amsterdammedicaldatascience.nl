# The CV page of Paul Elbers, /paulelbers/: everything written by hand.
#
# The publications are collected into publications.json by
#   python3 tools/cv.py collect
# After changing this file or that one, rebuild the page with
#   python3 tools/cv.py build
# and propose the change as a pull request. Nothing here goes live before
# Paul Elbers has merged it.
#
# In text, [words](address) makes a link. Links to other sites open in a new
# tab by themselves.

name = "Paul Elbers"
letters = "MD, PhD, EDIC"
short = "Intensivist, Amsterdam UMC"
photo = "pe-cv.jpg"   # in images/
description = "Paul Elbers is an intensivist and associate professor of intensive care medicine at Amsterdam UMC, founding director of the Center for Critical Care Computational Intelligence and co-founder of AmsterdamUMCdb. Positions, roles and publications."
lead = "Intensivist and associate professor of intensive care medicine at [Amsterdam UMC](https://www.amsterdamumc.org/en/research/researchers/paul-elbers-1.htm). Founding director of the [Center for Critical Care Computational Intelligence](../c4i/) and co-founder of [AmsterdamUMCdb](../#amsterdamumcdb)."
email = "p.elbers@amsterdamumc.nl"
address = "Department of Intensive Care Medicine, Amsterdam UMC, Amsterdam, the Netherlands"

about = [
  "Paul Elbers works where intensive care medicine meets data science. His aim is to use the data of every previous intensive care patient to improve the care of every future one: sharing intensive care data, building models with artificial intelligence, bringing them to the bedside as decision support, and testing in clinical trials whether patients are better off.",
  "He co-founded [AmsterdamUMCdb](../#amsterdamumcdb), the first freely available, highly granular intensive care database from within the European Union, and leads the [Center for Critical Care Computational Intelligence](../c4i/) (C4I) at Amsterdam UMC. During the COVID-19 pandemic the center coordinated the [Dutch Data Warehouse](https://doi.org/10.1186/s13054-021-03733-z), which brought together the full health records of critically ill COVID-19 patients from hospitals across the Netherlands. He also initiated [ICUdata](https://www.icudata.nl/), a foundation that combines the data of Dutch intensive care units.",
  "His current work focuses on reinforcement learning at the bedside: algorithms that learn the best treatment from data, combined with [randomization when needed](https://doi.org/10.1007/s00134-026-08576-2), so that they keep learning while patients are protected.",
]

